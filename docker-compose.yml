# Orquestacion local. Las variables KEYCLOAK_* del dashboard se leen
# de un .env en la raiz del repo (docker compose lo carga solo); ese archivo
# nunca se commitea. Ver .env.example para los nombres esperados.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      JAVA_OPTS_APPEND: -Xmx256m -Xms128m -XX:MaxMetaspaceSize=128m
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/cites-realm.json:/opt/keycloak/data/import/cites-realm.json:ro

  dashboard:
    build: .
    command: streamlit run app.py --server.address=0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - keycloak
    environment:
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    volumes:
      - ./data:/app/data

volumes:
  keycloak_data:
